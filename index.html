<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mira i Fes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2541;--night:#151c33;--paper:#f7f3ec;--amber:#f2b544;--amber-d:#b97f12;--sage:#8fb39a;--plum:#6b4e71;
  --f:"Atkinson Hyperlegible","Segoe UI",system-ui,Arial,sans-serif;--fd:"Bricolage Grotesque","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#1c2541;--paper:#f7f3ec}}
:root[data-theme="dark"]{--ink:#1c2541;--paper:#f7f3ec}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--night);color:#fff;font-family:var(--f);user-select:none;-webkit-user-select:none;touch-action:none}
body.nocur,body.nocur *{cursor:none!important}
#c,#ov{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ov{pointer-events:none;z-index:50}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:.5vmin solid var(--amber);outline-offset:.3vmin}
.scr{position:fixed;inset:0;display:none}
.scr.on{display:flex}

/* ---- inici ---- */
#start{z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;text-align:center;padding:4vmin;overflow:hidden;
  background:linear-gradient(#141b33 0%,#24305a 45%,#5a4a78 72%,#c9876a 100%)}
#start .sky{position:absolute;inset:0;pointer-events:none}
#start .sky svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh}
#start .moon{position:absolute;left:12%;top:14%;width:10vmin;height:10vmin;border-radius:50%;background:#f6f1d8;box-shadow:0 0 0 2.4vmin rgba(246,241,216,.08),0 0 0 5vmin rgba(246,241,216,.04)}
#start h1{position:relative;font-family:var(--fd);font-weight:800;font-size:13vmin;line-height:.95;color:var(--paper);letter-spacing:-.02em;text-shadow:0 1vmin 3vmin rgba(0,0,0,.35)}
#start h1::after{content:"";display:block;width:22vmin;height:1.4vmin;border-radius:1vmin;background:var(--amber);margin:2.2vmin auto 0}
#start p{position:relative;font-size:2.5vmin;max-width:90vmin;line-height:1.55;color:var(--ink);background:rgba(247,243,236,.92);padding:1.8vmin 3vmin;border-radius:2vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.25)}
#go{position:relative;font-family:var(--fd);font-size:6vmin;font-weight:800;padding:2.2vmin 9vmin;border-radius:7vmin;background:var(--amber);color:var(--ink);box-shadow:0 1.1vmin 0 var(--amber-d),0 2.2vmin 3vmin rgba(0,0,0,.3);transition:transform .15s}
#go:hover{transform:translateY(-.4vmin)}
#start label{position:relative;z-index:1;text-shadow:0 .2vmin .8vmin rgba(0,0,0,.6);font-size:2.3vmin;display:flex;gap:1.2vmin;align-items:center;cursor:pointer;font-weight:700;color:var(--paper)}
#start input{width:2.8vmin;height:2.8vmin;accent-color:var(--amber)}

/* ---- menú ---- */
#menu{z-index:20;flex-direction:column;padding:2.4vmin 3vmin 3vmin;gap:2vmin;background:radial-gradient(120% 90% at 50% -10%,#33416e,#1c2541 55%,#121831)}
#menu header{display:flex;align-items:center;justify-content:space-between}
#menu h1{font-family:var(--fd);font-size:5.2vmin;font-weight:800;color:var(--paper);letter-spacing:-.01em}
.hb{font-size:2.3vmin;font-weight:700;padding:1.3vmin 2.6vmin;border-radius:2vmin;background:rgba(247,243,236,.14);margin-left:1.2vmin;color:var(--paper)}
.hb:hover{background:rgba(247,243,236,.24)}
#grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:2.2vmin;min-height:0}
.card{position:relative;border-radius:2.2vmin;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:0;box-shadow:0 .8vmin 0 rgba(0,0,0,.25),0 1.6vmin 3vmin rgba(0,0,0,.3);transition:transform .18s}
.card .th{position:relative;flex:1;min-height:0;border-radius:2.2vmin 2.2vmin 0 0;overflow:hidden;background:var(--c);display:flex;align-items:center;justify-content:center}
.card canvas{position:absolute;inset:0;width:100%;height:100%}
.card .nm{font-size:2.15vmin;font-weight:700;padding:.9vmin 1vmin 1.1vmin;text-align:center;line-height:1.15;border-top:.6vmin solid var(--c)}
.dwell::after{content:"";position:absolute;inset:-1vmin;border-radius:3vmin;pointer-events:none;padding:1vmin;background:conic-gradient(var(--amber) calc(var(--p,0)*360deg),transparent 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.dwell.hov{transform:scale(1.045);outline:.5vmin solid rgba(255,255,255,.75);outline-offset:.3vmin}

/* ---- navegació dins l'escenari ---- */
#nav{z-index:10;pointer-events:none;display:none}
#nav.on{display:block}
.nb{pointer-events:auto;position:absolute;top:calc(2vmin + env(safe-area-inset-top,0px));width:12vmin;height:12vmin;border-radius:50%;background:rgba(247,243,236,.9);box-shadow:0 .6vmin 0 rgba(0,0,0,.2),0 1vmin 2.4vmin rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.nb svg{width:52%;height:52%}
.nb.dwell::after{border-radius:50%}
#nPrev{left:2vmin}#nHome{left:16vmin}#nNext{right:2vmin}
#nav.mini .nb{width:6vmin;height:6vmin;opacity:.45}
#nav.mini #nHome{left:9vmin}
#stitle{position:absolute;top:calc(2.4vmin + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:2.8vmin;font-weight:800;color:var(--ink);background:rgba(247,243,236,.88);padding:.7vmin 2.4vmin;border-radius:3vmin;white-space:nowrap;box-shadow:0 .5vmin 1.5vmin rgba(0,0,0,.2)}

/* ---- opcions ---- */
#opts,#cred{position:fixed;inset:0;z-index:60;background:rgba(10,14,30,.6);display:none;align-items:center;justify-content:center}
#cred{z-index:61}
#opts.on,#cred.on{display:flex}
.panel{background:#fff;color:#1a1d2e;border-radius:16px;padding:22px 26px;width:min(680px,94vw);max-height:92vh;overflow:auto;font-size:16px}
.panel h2{font-family:var(--fd);font-size:24px;margin-bottom:10px;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #eee}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid #c9cfdf;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:14px;color:var(--ink);background:#fff}
.seg button.sel{background:var(--ink);color:#fff}
.row input[type=range]{width:210px;accent-color:var(--ink)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
.stat{margin-top:12px}
.keys{font-size:13px;color:#555;margin-top:8px;line-height:1.8}
.keys kbd{background:#eee;border-radius:4px;padding:1px 6px;font-family:inherit;border:1px solid #ccc}
#oClose,#credClose{margin-top:14px;background:var(--ink);color:#fff;padding:10px 24px;border-radius:10px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(4vmin + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,24,40,.85);padding:1.4vmin 3vmin;border-radius:2vmin;font-size:2.6vmin;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
#langs{position:absolute;top:calc(2.2vmin + env(safe-area-inset-top,0px));right:2.2vmin;display:flex;align-items:center;gap:.7vmin;background:rgba(247,243,236,.92);padding:.8vmin 1vmin;border-radius:4vmin;box-shadow:0 .6vmin 2vmin rgba(0,0,0,.2);z-index:2;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 4.4vmin)}
#langs .globe{width:3.4vmin;height:3.4vmin;color:var(--ink);margin:0 .3vmin 0 .5vmin;display:flex}
#langs .globe svg{width:100%;height:100%}
#langs button{font-size:2vmin;font-weight:700;color:var(--ink);padding:.8vmin 1.5vmin;border-radius:3vmin}
#langs button:hover{background:rgba(28,37,65,.08)}
#langs button.sel{background:var(--ink);color:#fff}
#iLang{font:inherit;font-size:15px;padding:5px 8px;border-radius:8px;border:1px solid #c9cfdf;color:var(--ink)}
#auria{position:absolute;left:2.4vmin;bottom:calc(2.4vmin + env(safe-area-inset-bottom,0px));z-index:3;background:#fff;padding:2vmin 2.6vmin;border-radius:2vmin;box-shadow:0 .8vmin 2.4vmin rgba(0,0,0,.25);display:flex}
#auria img{height:7vmin;width:auto;display:block}
#credBtn{position:absolute;right:2.4vmin;bottom:calc(2.4vmin + env(safe-area-inset-bottom,0px));z-index:3;font-size:2.3vmin;font-weight:700;color:var(--ink);background:rgba(247,243,236,.92);padding:1.2vmin 2.6vmin;border-radius:4vmin;box-shadow:0 .6vmin 2vmin rgba(0,0,0,.2)}
#cred .panel{line-height:1.5}
#cred .panel p{margin:0 0 10px}
#cred a{color:#2f4f9f}
@media (prefers-reduced-motion: reduce){#go{transition:none}}
</style>
</head>

'use strict';
/* =========================================================
   MIRA I FES — nucli: utilitats, configuració, so, música, dibuix
   ========================================================= */
const TAU=Math.PI*2,PI=Math.PI,VW=1920,VH=1080,U=VH/100;
const $=s=>document.querySelector(s);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const eOut=t=>1-(1-t)*(1-t),eIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eBack=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const now=()=>performance.now()/1000;
const FONT='"Atkinson Hyperlegible","Segoe UI",system-ui,Arial,sans-serif';
const DFONT='"Bricolage Grotesque","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif';

/* ---------------- configuració ---------------- */

let AC=null,SFXG=null,MUSG=null,REVS=null,NOISE=null,PAN=0;
function makeIR(dur,decay){const len=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  const master=AC.createGain(),comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
  master.connect(comp);comp.connect(AC.destination);
  SFXG=AC.createGain();SFXG.connect(master);MUSG=AC.createGain();MUSG.connect(master);
  const conv=AC.createConvolver();conv.buffer=makeIR(1.8,2.6);REVS=AC.createGain();REVS.gain.value=.22;REVS.connect(conv);conv.connect(master);
  const len=AC.sampleRate*2;NOISE=AC.createBuffer(1,len,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  setVol();MUS.next=AC.currentTime+.3}
function setVol(){if(!AC)return;SFXG.gain.value=CFG.sound?CFG.vol:0;MUSG.gain.value=CFG.sound&&CFG.music?CFG.mvol*.55:0;REVS.gain.value=CFG.sound?.22:0}
function out(g,pan,dest){if(dest){g.connect(dest);return}
  let n=g;if(AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan??PAN,-1,1);g.connect(p);n=p}
  n.connect(SFXG);const w=AC.createGain();w.gain.value=.6;n.connect(w);w.connect(REVS)}
const ok=()=>AC&&CFG.sound;
function tone(f,dur,o={}){if(!ok())return;const{type='sine',g=.25,a=.005,f2=null,t0=0,pan,dest,lp}=o;const t=AC.currentTime+t0;
  const os=AC.createOscillator(),G=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
  if(o.det)os.detune.value=o.det;
  G.gain.setValueAtTime(0,t);G.gain.linearRampToValueAtTime(g,t+a);G.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=os;if(lp){const F=AC.createBiquadFilter();F.type='lowpass';F.frequency.value=lp;os.connect(F);n=F}
  n.connect(G);out(G,pan,dest);os.start(t);os.stop(t+dur+.05)}
function noise(dur,o={}){if(!ok())return;const{g=.25,type='bandpass',f=1000,q=1,f2=null,a=.005,t0=0,pan,dest}=o;const t=AC.currentTime+t0;
  const s=AC.createBufferSource();s.buffer=NOISE;s.loop=true;const F=AC.createBiquadFilter();F.type=type;F.frequency.setValueAtTime(f,t);if(f2)F.frequency.exponentialRampToValueAtTime(f2,t+dur);F.Q.value=q;
  const G=AC.createGain();G.gain.setValueAtTime(0,t);G.gain.linearRampToValueAtTime(g,t+a);G.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(F);F.connect(G);out(G,pan,dest);s.start(t,Math.random());s.stop(t+dur+.05)}
const mtof=m=>440*Math.pow(2,(m-69)/12);
/* corda pinçada (Karplus-Strong) amb memòria cau */
const PLK={};
function pluckBuf(f,dur){const key=f.toFixed(1)+'_'+dur;if(PLK[key])return PLK[key];const sr=AC.sampleRate,N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*dur),b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),buf=new Float32Array(N);
  for(let i=0;i<N;i++)buf[i]=Math.random()*2-1;let p=0;for(let i=0;i<len;i++){const nx=(p+1)%N,v=buf[p];d[i]=v;buf[p]=(v+buf[nx])*.4985;p=nx}PLK[key]=b;return b}
let DIST=null;
function distCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x))}return c}
function pluck(f,o={}){if(!ok())return;const{g=.5,dur=2.4,t0=0,pan,drive=false}=o;const t=AC.currentTime+t0;const s=AC.createBufferSource();s.buffer=pluckBuf(f,dur);
  const G=AC.createGain();G.gain.value=g;
  if(drive){const ws=AC.createWaveShaper();ws.curve=distCurve(28);const F=AC.createBiquadFilter();F.type='lowpass';F.frequency.value=3200;const pre=AC.createGain();pre.gain.value=2.2;
    s.connect(pre);pre.connect(ws);ws.connect(F);F.connect(G);G.gain.value=g*.32}else{const F=AC.createBiquadFilter();F.type='lowpass';F.frequency.value=5000;s.connect(F);F.connect(G)}
  out(G,pan);s.start(t)}
function bell(f,o={}){const g=o.g??.16;tone(f,1.6,{g,type:'sine',...o});tone(f*2.76,.7,{g:g*.35,...o});tone(f*5.4,.35,{g:g*.15,...o})}
function ep(f,o={}){const g=o.g??.1;tone(f,o.dur??1,{g,type:'sine',...o});tone(f*2,(o.dur??1)*.4,{g:g*.25,type:'triangle',...o})}

    const G=AC.createGain(),L=AC.createOscillator(),LG=AC.createGain();L.frequency.value=24;LG.gain.value=.2;L.connect(LG);LG.connect(G.gain);G.gain.setValueAtTime(.25,t);G.gain.linearRampToValueAtTime(0,t+1.6);

const CH={M7:[0,4,7,11],m7:[0,3,7,10],'7':[0,4,7,10],M:[0,4,7],m:[0,3,7],M9:[0,4,7,14],m9:[0,3,7,14],sus:[0,5,7,10],'6':[0,4,7,9]};
const MUS={cur:null,next:0,step:0,beats:[]};
function musicFor(def){MUS.cur=def&&def.mus?def.mus:null;MUS.step=0;MUS.beats=[];if(AC)MUS.next=AC.currentTime+.4}
function schedStep(m,st,t,spb){const T0=t-AC.currentTime;if(T0<-.02)return;
  if(m.style==='house'){const sb=st%8;const r=m.root;
    if(sb%2===0){tone(150,.35,{f2:42,g:.55,t0:T0,pan:0});MUS.beats.push(t)}
    if(sb%2===1){noise(.05,{type:'highpass',f:8000,g:.15,t0:T0,pan:.2});tone(mtof(r-12+(st%16>=12?5:0)),spb*.9,{type:'sawtooth',g:.12,lp:420,t0:T0,pan:0})}
    if(sb===4)noise(.18,{f:1700,q:.8,g:.12,t0:T0,pan:-.1});return}
  const bar=Math.floor(st/8),s8=st%8,ch=m.prog[bar%m.prog.length],root=m.root+ch[0],iv=CH[ch[1]];
  if(s8===0){iv.forEach((n,i)=>{tone(mtof(root+12+n),spb*8.2,{type:'triangle',g:.035,a:.5,lp:m.lp||1300,t0:T0,dest:MUSG,det:i?4:-4})});tone(mtof(root-12),spb*3.6,{g:.13,a:.02,t0:T0,dest:MUSG})}
  if(s8===5&&m.bass2)tone(mtof(root-12+7),spb*2.5,{g:.09,t0:T0,dest:MUSG});
  const pat=m.arp||[0,-1,2,1,-1,3,1,-1];const k=pat[s8];
  if(k>=0&&Math.random()<(m.dens??.8)){const n=iv[k%iv.length]+(k>=iv.length?12:0);const f=mtof(root+24+n);
    if(m.inst==='pluck')pluck(f,{g:.12,dur:1.2});else{tone(f,spb*3,{g:.045,t0:T0,dest:MUSG});tone(f*2,spb*1.2,{type:'triangle',g:.012,t0:T0,dest:MUSG})}}
  if(m.brush&&(s8===2||s8===6))noise(.08,{type:'highpass',f:6000,g:.035,t0:T0,dest:MUSG})}
setInterval(()=>{if(!AC||!MUS.cur||!CFG.sound||(!MUS.cur.inst&&!CFG.music))return;const m=MUS.cur,spb=60/m.bpm/2;if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+.05;
  while(MUS.next<AC.currentTime+.15){schedStep(m,MUS.step,MUS.next,spb);MUS.next+=spb;MUS.step++}},30);

/* ---------------- primitives de dibuix ---------------- */
function rrect(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}}
function oval(c,x,y,rx,ry,fill,stroke,lw){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.stroke()}}
function poly(c,pts,fill,stroke,lw){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||2;c.lineJoin='round';c.stroke()}}
function line(c,x1,y1,x2,y2,col,lw){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=lw||2;c.lineCap='round';c.stroke()}
function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,col])=>g.addColorStop(o,col));return g}
function rg(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach(([o,col])=>g.addColorStop(o,col));return g}
function txt(c,s,x,y,size,col,o={}){c.font=`${o.w||700} ${size}px ${o.f||FONT}`;c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';
  if(o.st){c.lineWidth=o.sw||size*.16;c.strokeStyle=o.st;c.lineJoin='round';c.strokeText(s,x,y)}c.fillStyle=col;c.fillText(s,x,y)}
function spark(c,x,y,r,f){c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x+r*.12,y-r*.12,x+r,y);c.quadraticCurveTo(x+r*.12,y+r*.12,x,y+r);c.quadraticCurveTo(x-r*.12,y+r*.12,x-r,y);c.quadraticCurveTo(x-r*.12,y-r*.12,x,y-r);c.fillStyle=f;c.fill()}
function note(c,x,y,s,col){c.fillStyle=col;c.save();c.translate(x,y);c.rotate(-.25);oval(c,0,0,s*.55,s*.4,col);c.restore();c.fillRect(x+s*.42,y-s*1.6,s*.16,s*1.6);c.beginPath();c.moveTo(x+s*.5,y-s*1.6);c.quadraticCurveTo(x+s*1.2,y-s*1.1,x+s*.9,y-s*.6);c.strokeStyle=col;c.lineWidth=s*.16;c.stroke()}

/* ---------------- partícules i objectes efímers ---------------- */
let PS=[],OBJS=[];
function P(o){if(PS.length>(LOWQ?160:600))return;PS.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,dr:1,s:10,gr:0,rot:0,vr:0,life:1,col:'#fff',k:'dot',a0:1},o,{max:o.life||1}))}
function burst(x,y,n,cols,o={}){for(let i=0;i<n;i++){const a=rnd(TAU),v=rnd(o.v0??120,o.v1??420);P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.up||0),g:o.g??500,dr:.97,s:rnd(o.s0??6,o.s1??14),life:rnd(.6,1.2),col:pick(cols),k:o.k||pick(['conf','dot','spark']),rot:rnd(TAU),vr:rnd(-8,8)})}}
function bigText(s,x,y,col,size){P({x,y,k:'big',txt:s,col:col||'#fff',s:size||120,life:1.8,vy:-30})}
function popText(s,x,y,col,size){P({x,y,k:'txt',txt:s,col:col||'#fff',s:size||56,life:1.3,vy:-90})}
function stepP(dt){for(const p of PS){const k=Math.pow(p.dr,dt*60);p.vx*=k;p.vy=p.vy*k+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.s=Math.max(.1,p.s+p.gr*dt);p.life-=dt}PS=PS.filter(p=>p.life>0)}
function drawP(c){for(const p of PS){const a=clamp(p.life/p.max*1.6,0,1)*p.a0;if(a<=0)continue;c.globalAlpha=a;const s=p.s;
  if(p.k==='dot')oval(c,p.x,p.y,s/2,s/2,p.col);
  else if(p.k==='spark')spark(c,p.x,p.y,s,p.col);
  else if(p.k==='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-s/2,-s/4,s,s/2);c.restore()}
  else if(p.k==='smoke'){oval(c,p.x,p.y,s,s,p.col)}
  else if(p.k==='drop'){c.save();c.translate(p.x,p.y);c.rotate(Math.atan2(p.vy,p.vx)-PI/2);oval(c,0,0,s*.35,s*.7,p.col);c.restore()}
  else if(p.k==='note')note(c,p.x,p.y,s,p.col);
  else if(p.k==='ring'){c.beginPath();c.ellipse(p.x,p.y,s,s*(p.sq||.3),0,0,TAU);c.strokeStyle=p.col;c.lineWidth=p.lw||4;c.stroke()}
  else if(p.k==='leaf'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);oval(c,0,0,s,s*.45,p.col);c.restore()}
  else if(p.k==='txt'){txt(c,p.txt,p.x,p.y,s,p.col,{w:800,f:DFONT,st:'rgba(20,24,40,.85)'})}
  else if(p.k==='big'){const t=1-p.life/p.max,sc=eBack(Math.min(1,t*4));c.save();c.translate(p.x,p.y);c.scale(sc,sc);txt(c,p.txt,0,0,s,p.col,{w:800,f:DFONT,st:'rgba(20,24,40,.9)',sw:s*.14});c.restore()}
}c.globalAlpha=1}
function obj(o){OBJS.push(Object.assign({t:0,z:2000},o));return o}
function stepObjs(dt){for(const o of OBJS){o.t+=dt;if(o.upd&&o.upd(o,dt)===false)o.dead=true;if(o.dur&&o.t>=o.dur){o.dead=true;if(o.end)o.end(o)}}OBJS=OBJS.filter(o=>!o.dead)}
/* vol en arc d'un punt a un altre */
function fly(from,to,dur,draw,end,arc=-200){return obj({dur,z:3000,end,draw(c,o){const t=eIO(Math.min(1,o.t/dur)),x=lerp(from[0],to[0],t),y=lerp(from[1],to[1],t)+arc*Math.sin(t*PI);c.save();c.translate(x,y);draw(c,t);c.restore()}})}

  init(sc){const d=sc.d;d.b=CITY.map(([x,w,h],i)=>{const cols=Math.floor((w-30)/40),rows=Math.floor((h-50)/52),W=[];for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){const on=hash(i*99+r*7+k)>.62?1:0;W.push({x:x+20+k*40,y:CITY_B-h+30+r*52,v:on,to:on,dl:0,hue:hash(i+r+k*3)>.7?200:40})}return{on:0,W}});

L('fr',{title:'Regarde et Fais','start.desc':"Des scènes de la vie adulte pour s'entraîner à contrôler l'ordinateur avec le regard : routines à la maison, loisirs, sport et détente.",
  'start.adult':"<b>Pour l'accompagnant :</b> cliquez sur « Commencer » pour activer le son. Les options s'ouvrent avec la touche <b>O</b> ou depuis le menu.",
  go:'Commencer ▶',fs:'Plein écran',lang:'Langue','menu.title':'Choisis une activité',opt:'⚙ Options',fsBtn:'⛶ Plein écran',prev:'Scène précédente',home:'Menu',next:'Scène suivante',
  'opts.h':"Options (pour l'accompagnant)",size:'Taille des objets',big:'Grands',med:'Moyens',small:'Petits',act:'Activation',hover:'Au survol',dwell:'En maintenant le regard',
  dwellTime:'Temps de fixation :',speed:'Vitesse du mouvement ambiant :',cursor:'Curseur',ring:'Anneau',system:'Du système',none:'Aucun',sound:'Son',vol:'Volume',music:'Musique de fond',musicVol:'Volume de la musique',
  trail:"Traînée d'étincelles derrière le curseur",simple:'Fond simplifié (noir, contraste élevé)',navGaze:'Boutons de navigation activables par le regard',fast:"Mode rapide (pour ordinateurs lents ; s'active seul si besoin)",
  stats:'Activations pendant cette session :',close:'Fermer',stopped:'arrêté',keys:KB(['changer de scène','menu','taille',"type d'activation",'son','plein écran','ralenti','options']),
  credBtn:'Crédits','cred.h':'Crédits','cred.body':`<p>Cette version pour adultes a été créée avec l'intelligence artificielle (<b>Claude Opus 5.5</b>, d'Anthropic), inspirée de <b>Mira i Juga</b> de l'<b>UTAC</b> (${UTAC}), dont elle conserve le fonctionnement et les options.</p><p>Les dessins, les animations, les effets sonores et la musique sont générés par programme. Aucun son enregistré n'est utilisé.</p>`,
  'toast.size':'Taille : ','toast.sizes':'grands|moyens|petits','toast.dwell':'Activation : en maintenant le regard','toast.hover':'Activation : au survol','toast.sndOn':'Son activé','toast.sndOff':'Son désactivé','toast.slow':'Ralenti','toast.normal':'Vitesse normale'},
  ['Le café du matin','On fait les courses','On fait une paella','On regarde la télé','Messages sur le portable','Le potager','Guitare électrique','Session de DJ','Bowling','Boccia','Fléchettes','Photo nature',"Peinture à l'atelier",'Pêche au lac','La ville la nuit'],
  {'big.morning':'Bonjour !','big.paid':'Payé !','big.enjoy':'Bon appétit !','big.harvest':'Récolte !','big.point':'points',tv:'Infos|Nature|Football|Cuisine|Musique|Météo',
   'chat.me':"Salut !|Comment ça va ?|On déjeune ensemble ?|Merci beaucoup !|Je t'embrasse|À bientôt !",'chat.re':'Salut ! Quelle joie !|Très bien ! Et toi ?|Oui ! Samedi à 13 h ?|De rien, avec plaisir !|Moi aussi, très fort !|À bientôt ! Prends soin de toi.'});
let LANG='ca';try{const l=localStorage.getItem('miraifes_lang');if(l&&I18N[l])LANG=l}catch(e){}
const T=k=>(I18N[LANG]&&I18N[LANG][k])??I18N.ca[k]??k;
const TL=k=>String(T(k)).split('|');

/* =========================================================
   APLICACIÓ: escenaris, motor i interfície
   ========================================================= */
const SCENES=[CAFE,COMPRA,PAELLA,TELE,MISSATGES,HORT,GUITARRA,DJ,BITLLES,BOCCIA,DARDS,FOTO,PINTURA,PESCA,CIUTAT];
const AV=SCENES.map((s,i)=>i);
const cv=$('#c'),ctx=cv.getContext('2d'),ov=$('#ov'),oc=ov.getContext('2d');
let S=1,OX=0,OY=0,DPR=1,mx=-9999,my=-9999,cmx=-9999,cmy=-9999,lastMove=0,view='start',cur=null,idx=0,optsOpen=false,dwEl=null,dwT=0,TRAIL=[],BGC=null;
const STATS={n:0};
function resize(){DPR=LOWQ?Math.min(1,window.devicePixelRatio||1)*.7:Math.min(2,window.devicePixelRatio||1);const cw=innerWidth,ch=innerHeight;S=Math.min(cw/VW,ch/VH);OX=(cw-VW*S)/2;OY=(ch-VH*S)/2;
  for(const k of[cv,ov]){k.width=Math.round(cw*DPR);k.height=Math.round(ch*DPR)}BGC=null}
if(CFG.lowq)LOWQ=true;addEventListener('resize',resize);resize();
function toStage(e){cmx=e.clientX;cmy=e.clientY;mx=(e.clientX-OX)/S;my=(e.clientY-OY)/S;lastMove=performance.now()}
addEventListener('pointermove',toStage,{passive:true});
addEventListener('pointerdown',e=>{toStage(e);audioInit()},{passive:true});
document.documentElement.addEventListener('mouseleave',()=>{mx=my=cmx=cmy=-9999});
const stage=c=>c.setTransform(DPR*S,0,0,DPR*S,OX*DPR,OY*DPR);

function makeScene(def){const sc={def,T:[],t:0,d:{},grace:.6};
  sc.add=o=>{const t=Object.assign({x:0,y:0,ax:0,ay:0,cy:0,R:0,hot:false,dw:0,cd:0,cool:.6,off:false,hide:false,rt:0},o);posT(t);sc.T.push(t);return t};
  def.init(sc);return sc}
function posT(t){const k=t.noscale?1:SZ();t.x=t.ax+(t.cx||0)*k;t.y=t.ay-(t.cy||0)*k;t.R=t.fr*U*SZ()}
function fire(t,sc){t.cd=t.cool;t.rt=t.rep||0;STATS.n++;PAN=clamp((t.x/VW-.5)*1.4,-1,1);if(t.hit)t.hit(t,sc);PAN=0}
function boxOf(t){const b=t.box(t),k=t.noscale?1:SZ();return[b[0]*k,b[1]*k]}
function stepScene(dt){const sc=cur,d=sc.def,sp=dt*CFG.speed;sc.t+=dt;sc.grace-=dt;if(d.update)d.update(sc,dt,sp);
  for(const t of sc.T){if(t.upd)t.upd(t,sp,sc,dt);posT(t);t.cd=Math.max(0,t.cd-dt);
    let ins=false;if(!t.off&&!t.hide&&!optsOpen&&sc.grace<=0&&mx>-999){if(t.box){const b=boxOf(t);ins=Math.abs(mx-t.x)<b[0]/2&&Math.abs(my-t.y)<b[1]/2}else{const r=t.R*1.08+14;ins=(mx-t.x)**2+(my-t.y)**2<r*r}}
    if(t.paint){t.hot=ins;if(ins&&t.pnt)t.pnt(mx,my,dt);continue}
    if(CFG.mode===0){if(ins){t.rt-=dt;if(t.cd<=0&&(!t.hot||(t.rep&&t.rt<=0)))fire(t,sc)}}
    else{if(ins&&t.cd<=0){t.dw+=dt;if(t.dw>=CFG.dwell){t.dw=0;fire(t,sc)}}else if(!ins)t.dw=Math.max(0,t.dw-dt*1.5)}
    t.hot=ins}
  stepP(dt);stepObjs(dt)}
function getBg(sc){if(BGC&&BGC.sc===sc&&BGC.simple===CFG.simple&&BGC.S===S)return BGC.cv;
  const b=document.createElement('canvas');b.width=Math.max(1,Math.round(VW*S*DPR));b.height=Math.max(1,Math.round(VH*S*DPR));const c=b.getContext('2d');c.setTransform(S*DPR,0,0,S*DPR,0,0);
  if(CFG.simple){c.fillStyle='#000';c.fillRect(0,0,VW,VH)}else sc.def.paint(c,sc);BGC={sc,cv:b,simple:CFG.simple,S};return b}
function halo(c,t){if(t.nohalo)return;const pu=.8+Math.sin(now()*5)*.2;c.save();
  if(t.box){const[w,h]=boxOf(t);c.shadowColor='rgba(255,230,150,.9)';c.shadowBlur=30*pu;rrect(c,t.x-w/2-8,t.y-h/2-8,w+16,h+16,18,null,`rgba(255,240,190,${.75*pu})`,6)}
  else{const r=t.R*1.1;c.fillStyle=rg(c,t.x,t.y,r*.55,r*1.25,[[0,'rgba(255,245,200,0)'],[.55,`rgba(255,240,190,${.35*pu})`],[1,'rgba(255,240,190,0)']]);c.beginPath();c.arc(t.x,t.y,r*1.25,0,TAU);c.fill()}c.restore()}
function dwellRing(c,t){const p=Math.min(1,t.dw/CFG.dwell);c.save();c.lineCap='round';
  if(t.box){const[w,h]=boxOf(t);c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=10;c.strokeRect(t.x-w/2-10,t.y+h/2+12,w+20,1);c.strokeStyle='#fff';c.beginPath();c.moveTo(t.x-w/2-10,t.y+h/2+12);c.lineTo(t.x-w/2-10+(w+20)*p,t.y+h/2+12);c.stroke();c.restore();return}
  const r=t.R*1.08+10;c.beginPath();c.arc(t.x,t.y,r,0,TAU);c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=12;c.stroke();
  c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=8;c.beginPath();c.arc(t.x,t.y,r,-PI/2,-PI/2+p*TAU);c.strokeStyle='#fff';c.lineWidth=12;c.stroke();
  const a=-PI/2+p*TAU;c.shadowBlur=0;oval(c,t.x+Math.cos(a)*r,t.y+Math.sin(a)*r,10,10,'#f2b544','#fff',3);c.restore()}
function renderScene(c,sc,withBg){const d=sc.def;
  if(withBg){if(CFG.simple){c.fillStyle='#000';c.fillRect(0,0,VW,VH)}else d.paint(c,sc)}else c.drawImage(getBg(sc),0,0,VW,VH);
  if(d.ambBack&&(!CFG.simple||d.keepAmb))d.ambBack(c,sc);
  const Ls=sc.T.filter(t=>!t.hide).sort((a,b)=>(a.z??a.ay)-(b.z??b.ay));
  for(const t of Ls){if(t.hot&&!t.off&&!withBg)halo(c,t);c.save();if(t.off)c.globalAlpha=.45;c.translate(t.ax,t.ay);const k=t.noscale?1:SZ();c.scale(k,k);t.draw(c,t,sc);c.restore()}
  if(!withBg)for(const o of OBJS)o.draw(c,o);
  if(!CFG.simple&&d.ambFront)d.ambFront(c,sc)}
function drawScene(){const c=ctx;c.setTransform(1,0,0,1,0,0);c.fillStyle='#0f1424';c.fillRect(0,0,cv.width,cv.height);stage(c);
  c.save();c.beginPath();c.rect(0,0,VW,VH);c.clip();renderScene(c,cur,false);drawP(c);
  if(CFG.mode===1)for(const t of cur.T)if(t.dw>0&&!t.off&&!t.paint)dwellRing(c,t);c.restore()}

function drawOverlay(dt){oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,ov.width,ov.height);stage(oc);const vis=mx>-999&&!optsOpen&&view!=='start';
  if(CFG.trail&&vis&&performance.now()-lastMove<120)TRAIL.push({x:mx+rnd(-8,8),y:my+rnd(-8,8),l:.7,h:(performance.now()/8)%360});
  for(const p of TRAIL){p.l-=dt;p.y+=40*dt}TRAIL=TRAIL.filter(p=>p.l>0);for(const p of TRAIL){oc.globalAlpha=p.l/.7;spark(oc,p.x,p.y,4+10*p.l,`hsl(${p.h},90%,78%)`)}oc.globalAlpha=1;
  if(CFG.cursor===0&&vis){oc.beginPath();oc.arc(mx,my,24,0,TAU);oc.lineWidth=9;oc.strokeStyle='rgba(20,25,50,.55)';oc.stroke();oc.lineWidth=4.5;oc.strokeStyle='#fff';oc.stroke();oval(oc,mx,my,4,4,'#fff')}}

function clearDw(){if(dwEl){dwEl.style.setProperty('--p',0);dwEl.classList.remove('hov')}dwEl=null;dwT=0}
function domDwell(dt){if(optsOpen||view==='start'){clearDw();return}
  let el=null;if(cmx>-999){const e=document.elementFromPoint(cmx,cmy);el=e&&e.closest?e.closest('.dwell'):null}
  if(el!==dwEl){clearDw();dwEl=el;if(el)el.classList.add('hov')}
  if(!el)return;dwT+=dt;const need=el.classList.contains('nb')?Math.max(CFG.dwell,1.2):Math.max(CFG.dwell,.8);
  el.style.setProperty('--p',clamp(dwT/need,0,1));if(dwT>=need){el.style.setProperty('--p',0);dwT=-1;SFX.ui();el.click()}}

let last=performance.now(),TS=1,FEMA=1/60,SLOWN=0;
function loop(ts){const raw=Math.max(0,(ts-last)/1000),dt=Math.min(.05,raw);last=ts;
  if(view==='scene'&&raw<.5){FEMA=FEMA*.95+raw*.05;if(!LOWQ){SLOWN=FEMA>1/38?SLOWN+1:0;if(SLOWN>120){LOWQ=true;resize()}}}
  try{if(view==='scene'&&cur){stepScene(dt*TS);drawScene()}}catch(err){console.error(err)}
  domDwell(dt);drawOverlay(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------------- interfície ---------------- */
function show(id){$('#start').classList.toggle('on',id==='start');$('#menu').classList.toggle('on',id==='menu');$('#nav').classList.toggle('on',id==='scene')}
function updCursor(){document.body.classList.toggle('nocur',!optsOpen&&view!=='start'&&CFG.cursor!==1)}
function goMenu(){view='menu';cur=null;musicFor(null);PS=[];OBJS=[];clearDw();show('menu');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);updCursor()}
function openScene(i){idx=i;PS=[];OBJS=[];clearDw();cur=makeScene(SCENES[i]);view='scene';musicFor(SCENES[i]);show('scene');$('#stitle').textContent=T('sc.'+SCENES[i].id);updCursor()}
function stepScn(d){const k=AV.indexOf(idx);openScene(AV[(k+d+AV.length)%AV.length])}
function fsToggle(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
let toastT=0;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600)}

function thumb(def,cvs){const c=cvs.getContext('2d'),w=cvs.width,h=cvs.height,s=Math.max(w/VW,h/VH);c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,w,h);c.setTransform(s,0,0,s,(w-VW*s)/2,(h-VH*s)/2);
  const keepP=PS,keepO=OBJS,keep=[mx,my];mx=my=-9999;const sc=makeScene(def);sc.grace=99;sc.t=2;for(const t of sc.T){if(t.upd)t.upd(t,0,sc,0);posT(t)}
  const sim=CFG.simple;CFG.simple=false;try{renderScene(c,sc,true)}finally{CFG.simple=sim;[mx,my]=keep;PS=keepP;OBJS=keepO}}
function rethumbAll(){document.querySelectorAll('#grid .card').forEach((b,i)=>{const cv=b.querySelector('canvas');if(cv)requestAnimationFrame(()=>{try{thumb(SCENES[i],cv)}catch(e){console.error(e)}})})}
const grid=$('#grid');SCENES.forEach((s,i)=>{const b=document.createElement('button');b.className='card dwell';b.style.setProperty('--c',s.col);
  b.innerHTML=`<span class="th"><canvas width="480" height="270"></canvas></span><span class="nm" data-i18n="sc.${s.id}"></span>`;
  b.onclick=()=>openScene(i);grid.appendChild(b)});
rethumbAll();
$('#go').onclick=()=>{audioInit();if($('#fsChk').checked)fsToggle();goMenu()};
$('#bOpt').onclick=()=>toggleOpts(true);$('#bFs').onclick=fsToggle;
$('#nPrev').onclick=()=>stepScn(-1);$('#nNext').onclick=()=>stepScn(1);$('#nHome').onclick=goMenu;

function toggleOpts(v){optsOpen=v===undefined?!optsOpen:v;$('#opts').classList.toggle('on',optsOpen);syncOpts();updCursor()}
function setNav(){const n=$('#nav');n.classList.toggle('mini',!CFG.navGaze);n.querySelectorAll('.nb').forEach(b=>b.classList.toggle('dwell',CFG.navGaze))}
function syncOpts(){document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',+b.dataset.v===CFG[s.dataset.k])));
  $('#iDw').value=CFG.dwell;$('#oDw').textContent=(+CFG.dwell).toFixed(1);$('#iSp').value=CFG.speed;$('#oSp').textContent=CFG.speed==0?T('stopped'):(+CFG.speed).toFixed(1)+'×';
  $('#iSnd').checked=CFG.sound;$('#iMus').checked=CFG.music;$('#iMVol').value=CFG.mvol;$('#iVol').value=CFG.vol;$('#iTr').checked=CFG.trail;$('#iSim').checked=CFG.simple;$('#iNav').checked=CFG.navGaze;$('#iLow').checked=LOWQ;$('#oN').textContent=STATS.n}
function applyCfg(){save();setVol();syncOpts();setNav();updCursor()}
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;CFG[s.dataset.k]=+b.dataset.v;applyCfg()}));
$('#iDw').oninput=e=>{CFG.dwell=+e.target.value;applyCfg()};$('#iSp').oninput=e=>{CFG.speed=+e.target.value;applyCfg()};
$('#iVol').oninput=e=>{CFG.vol=+e.target.value;applyCfg()};$('#iSnd').onchange=e=>{CFG.sound=e.target.checked;audioInit();applyCfg()};
$('#iMus').onchange=e=>{CFG.music=e.target.checked;audioInit();applyCfg()};$('#iMVol').oninput=e=>{CFG.mvol=+e.target.value;applyCfg()};
$('#iTr').onchange=e=>{CFG.trail=e.target.checked;applyCfg()};$('#iSim').onchange=e=>{CFG.simple=e.target.checked;applyCfg()};$('#iNav').onchange=e=>{CFG.navGaze=e.target.checked;applyCfg()};
$('#iLow').onchange=e=>{LOWQ=e.target.checked;CFG.lowq=LOWQ;SLOWN=0;resize();applyCfg()};
$('#oClose').onclick=()=>toggleOpts(false);
$('#credBtn').onclick=e=>{e.stopPropagation();$('#cred').classList.add('on')};$('#credClose').onclick=()=>$('#cred').classList.remove('on');
$('#cred').addEventListener('click',e=>{if(e.target.id==='cred')$('#cred').classList.remove('on')});$('#opts').addEventListener('click',e=>{if(e.target.id==='opts')toggleOpts(false)});
setNav();syncOpts();

addEventListener('keydown',e=>{audioInit();const k=e.key.toLowerCase();
  if(k==='o'){toggleOpts();return}
  if(optsOpen){if(k==='escape')toggleOpts(false);return}
  if(view==='start'){if(k==='enter'||k===' ')$('#go').click();return}
  if(k==='arrowright'){if(view==='scene')stepScn(1);else openScene(AV[0])}
  else if(k==='arrowleft'){if(view==='scene')stepScn(-1);else openScene(AV[AV.length-1])}
  else if((k==='escape'||k==='m')&&view==='scene')goMenu();
  else if(k==='1'||k==='2'||k==='3'){CFG.size=+k-1;applyCfg();toast(T('toast.size')+TL('toast.sizes')[CFG.size])}
  else if(k==='d'){CFG.mode=1-CFG.mode;applyCfg();toast(CFG.mode?T('toast.dwell'):T('toast.hover'))}
  else if(k==='s'){CFG.sound=!CFG.sound;applyCfg();toast(CFG.sound?T('toast.sndOn'):T('toast.sndOff'))}
  else if(k==='l'){TS=TS<1?1:.33;toast(TS<1?T('toast.slow'):T('toast.normal'))}
  else if(k==='f')fsToggle()});

/* ---------------- idioma ---------------- */
function applyLang(){document.documentElement.lang=LANG;document.title=T('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=T(e.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.i18nAria)));
  document.querySelectorAll('#langs button').forEach(b=>{b.classList.toggle('sel',b.dataset.l===LANG);b.setAttribute('aria-pressed',b.dataset.l===LANG)});
  $('#iLang').value=LANG;if(cur)$('#stitle').textContent=T('sc.'+cur.def.id);syncOpts()}
function setLang(l){if(!I18N[l]||l===LANG)return;LANG=l;try{localStorage.setItem('miraifes_lang',l)}catch(e){}BGC=null;applyLang();rethumbAll()}
{const box=$('#langs'),sel=$('#iLang');for(const[l,n]of LANGS){const b=document.createElement('button');b.dataset.l=l;b.textContent=n;b.lang=l;b.onclick=e=>{e.stopPropagation();setLang(l)};box.appendChild(b);
  const o=document.createElement('option');o.value=l;o.textContent=n;sel.appendChild(o)}sel.onchange=e=>setLang(e.target.value)}
applyLang();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{BGC=null;rethumbAll()});


</script>
